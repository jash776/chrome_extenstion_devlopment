<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <!-- Chrome Browser Window Background -->
  <rect width="1280" height="800" fill="#f1f5f9" />
  
  <!-- Fake Browser Toolbar -->
  <rect width="1280" height="60" fill="#cbd5e1" />
  <rect x="20" y="20" width="20" height="20" rx="10" fill="#ef4444" />
  <rect x="50" y="20" width="20" height="20" rx="10" fill="#eab308" />
  <rect x="80" y="20" width="20" height="20" rx="10" fill="#22c55e" />
  <rect x="200" y="15" width="800" height="30" rx="15" fill="#ffffff" />
  
  <!-- Shadow overlay -->
  <rect x="0" y="60" width="1280" height="740" fill="#000000" opacity="0.3" />
  
  <!-- Extension Card Container -->
  <g transform="translate(420, 100)">
    <rect width="440" height="600" rx="20" fill="#ffffff" filter="drop-shadow(0 20px 13px rgb(0 0 0 / 0.15))" />
    
    <!-- App Header -->
    <rect width="440" height="150" rx="20" fill="#4f46e5" />
    <!-- Lock Icon Block -->
    <rect x="185" y="30" width="70" height="60" rx="15" fill="#6366f1" />
    <path d="M 210 55 L 210 45 A 10 10 0 0 1 230 45 L 230 55" fill="none" stroke="#ffffff" stroke-width="4" />
    <rect x="205" y="55" width="30" height="20" rx="5" fill="#ffffff" stroke="#ffffff" />
    
    <text x="220" y="120" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">PDF Unlocker</text>
    
    <!-- Upload Area -->
    <rect x="30" y="180" width="380" height="180" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="220" cy="245" r="30" fill="#e0e7ff" />
    <!-- Upload Cloud Arrow -->
    <path d="M 220 220 L 220 270 M 205 235 L 220 220 L 235 235" stroke="#4f46e5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="220" y="310" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">Tap to upload or drag &amp; drop</text>
    <text x="220" y="335" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Only protected PDF files</text>
    
    <!-- Info bar -->
    <rect x="80" y="390" width="280" height="40" rx="20" fill="#f1f5f9" />
    <circle cx="105" cy="410" r="6" fill="#94a3b8" />
    <text x="125" y="415" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Processed locally. Files never leave your device.</text>
  </g>
</svg>
